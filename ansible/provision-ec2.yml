---
- name: Provision an EC2 Instance in AWS
  hosts: localhost
  connection: local
  gather_facts: false
  
  vars:
    aws_region: us-east-1
    instance_name: "my-github-actions-instance"
    instance_type: "t3.micro"
    # Example AMI (Amazon Linux 2023 - adjust for your region)
    image_id: "ami-0453ec754f44f9a4a" 
    key_name: "my-dev-key"

  tasks:
    - name: Ensure amazon.aws collection requirements are installed
      ansible.builtin.debug:
        msg: "Starting EC2 provisioning..."

    - name: Launch or update EC2 instance
      amazon.aws.ec2_instance:
        name: "{{ instance_name }}"
        region: "{{ aws_region }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ image_id }}"
        key_name: "{{ key_name }}"
        state: running
        wait: true
        tags:
          Environment: Production
          ManagedBy: Ansible
      register: ec2_output

    - name: Display Instance Public IP
      ansible.builtin.debug:
        msg: "The instance {{ instance_name }} is running with IP {{ ec2_output.instances[0].public_ip_address }}"
