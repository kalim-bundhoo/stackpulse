- name: Launch or update EC2 instance securely
      amazon.aws.ec2_instance:
        name: "{{ instance_name }}"
        region: "{{ aws_region }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ image_id }}"
        key_name: "{{ key_name }}"
        ebs_optimized: true
        network_interfaces:
          - associate_public_ip_address: false
            device_index: 0
        state: running
        wait: true
        tags:
          Environment: Production
          ManagedBy: Ansible
      register: ec2_output
