name: Production CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Required for AWS OIDC token exchange
permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  security-and-quality:
    name: Security & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Credential & Secret Leak Detection
      - name: Run TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog-action@main
        with:
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.ref }}

      # 2. Infrastructure-as-Code (Terraform) Security Scan
      - name: Run Checkov (IaC Security)
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform

      # 3. Application Unit Testing (Adjust command based on your stack, e.g., npm test, pytest)
      - name: Run Unit Tests
        run: |
          echo "Running application tests..."
          # npm test || pytest || go test ./...

  build-and-scan-container:
    name: Build & Container Security
    needs: security-and-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build Docker Image
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: stackpulse-app:${{ github.sha }}

      # 5. Generate Software Bill of Materials (SBOM)
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: stackpulse-app:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: container-sbom
          path: sbom.spdx.json

      # 6. Container Vulnerability Scanning
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'stackpulse-app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      # 7. Secure OIDC AWS Authentication (No static access keys required!)
      - name: Authenticate to AWS via OIDC
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::551504153839:role/GitHubActionsProductionDeployRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 8. Push Image to Registry
      - name: Push Image to Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/stackpulse-app-prod:${{ github.sha }}"
          docker tag stackpulse-app:${{ github.sha }} $IMAGE_URI
          docker push $IMAGE_URI

  deploy-infrastructure:
    name: Deploy Terraform Infrastructure
    needs: build-and-scan-container
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::551504153839:role/GitHubActionsProductionDeployRole
          aws-region: us-east-1

      # 9. Automated Terraform Apply for Production
      - name: Terraform Init & Apply
        working-directory: environments/prod
        run: |
          terraform init
          terraform apply -auto-approve
