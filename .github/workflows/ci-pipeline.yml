name: Production CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  id-token: write
  contents: read
  security-events: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  security-and-quality:
    name: Security & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@d18d451a666e63234d3ad8d73b50c33a2ab624de # v3.88.8
        with:
          path: ./
          base: ""
          head: "HEAD"
          extra_args: --debug --only-verified

      - name: Run Checkov (IaC Security)
        uses: bridgecrewio/checkov-action@a25cf6db5834d9a690e54911d3326162a74c3d49 # v12.298.0
        with:
          framework: terraform
          soft_fail: false # Enforce security checks as a hard gate

      - name: Run Unit Tests
        run: |
          echo "Running application tests..."

  build-and-scan-container:
    name: Build & Container Security
    needs: security-and-quality
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebc0fb2af1bd34ce15100e18d53 # v3.10.0

      - name: Build Docker Image
        uses: docker/build-push-action@47ad1e78453d1c7f2543aa5c473f12409646b364 # v6.13.0
        with:
          context: .
          load: true
          tags: stackpulse-app:${{ github.sha }}

      - name: Generate SBOM
        uses: anchore/sbom-action@f325610c9f16a5818fabd3afab30d52b36cd8346 # v0.18.0
        with:
          image: stackpulse-app:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d245f7549f21b # v4.6.0
        with:
          name: container-sbom
          path: sbom.spdx.json

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@18f2510ee3c0bbf6404300e1b303b7fc567bf856 # v0.29.0
        with:
          image-ref: 'stackpulse-app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@df1fb3663a0179a617d3cf2673295f1348126e73 # v3.28.9
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Authenticate to AWS via OIDC
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d101c5fe624 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::551504153839:role/GitHubActionsProductionDeployRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18426a7be1f9edd590cb7810e448117714b3 # v2.0.1

      - name: Push Image to Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/stackpulse-app-prod:${{ github.sha }}"
          docker tag stackpulse-app:${{ github.sha }} $IMAGE_URI
          docker push $IMAGE_URI

  deploy-infrastructure:
    name: Deploy Terraform Infrastructure
    needs: build-and-scan-container
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a37346d799f9206fa0fb9feb5d7d55681e # v3.1.2
        with:
          terraform_version: "1.5.7"

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d101c5fe624 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::551504153839:role/GitHubActionsProductionDeployRole
          aws-region: us-east-1

      - name: Terraform Init & Plan
        working-directory: environments/prod
        run: |
          terraform init
          terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        working-directory: environments/prod
        run: |
          terraform apply -input=false tfplan
